<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>VAR</title>
</head>
<body>
    <h1>Variáveis</h1>
    <hr>
        <button onclick="incrementarContagem()">+</button>
        <p id="p-contagem">
            0

        <h2>Vendas na Harry Ploter</h2>

        <div id="lista"></div>
        <output id="totalV"></output>
    <hr>

        <br>
        <button onclick="rolarDadoD2()">D2</button>
        <button onclick="rolarDadoD4()">D4</button>
        <button onclick="rolarDadoD6()">D6</button>

        <button onclick="rolarDadoD12()">D12</button>
        <button onclick="rolarDadoD20()">D20</button>
        <br>
        <output id="d2">D2: 0</output>
        <output id="d4">D4: 0</output>
        <output id="d6">D6: 0</output>

    <script src="script.js"></script>
